[project]
name = "finrag"
version = "1.0.0"
description = "Retrieval-augmented QA over FiQA-2018 with a measured retrieval stack (BM25, pgvector, RRF, cross-encoder), cited answers, an agentic mode, and an LLM judge checked against hand labels."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "numpy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "bm25s>=0.2.10",
    "PyStemmer>=2.2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "langgraph>=0.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
# Real models. Kept optional so CI and unit tests run with a deterministic fake embedder.
models = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]
# Fine-tuning the reranker (finrag train-reranker); not needed to serve.
train = [
    "datasets>=3.0",
    "accelerate>=1.0",
]

[project.scripts]
finrag = "finrag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the pgvector container (make infra)"]

[tool.coverage.run]
source = ["finrag"]
omit = ["*/finrag/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Linux (Docker, CI) gets the CPU-only torch wheel (~200 MB) instead of the CUDA build (~2.5 GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
